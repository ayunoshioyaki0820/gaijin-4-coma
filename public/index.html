<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>外人4コマメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>外人4コマメーカー</h1>
  <div class="hb"><button class="sm" id="help">使い方</button><button class="sm" id="share">SNS共有</button></div>
</header>
<main class="app">
  <section class="stage"><canvas id="cv" aria-label="4コマのプレビュー"></canvas></section>
  <aside>
    <div class="grp"><h2>テンプレート</h2>
      <div class="seg" id="tpl"><button data-t="normal">冷める → 盛り上がる</button><button data-t="reverse">盛り上がる → 冷める</button></div></div>
    <div class="grp"><h2>スタイル</h2><div class="styles" id="styles"></div></div>
    <div class="grp"><h2>コマの順番</h2><div id="rows"></div></div>
    <div class="grp" id="ed"></div>
    <div class="grp"><h2>出力設定</h2>
      <label class="lab">画像の幅<select data-o="w"><option value="720">720px</option><option value="1080">1080px(SNS向け)</option><option value="1440">1440px</option></select></label>
      <label class="lab">コマの比率<select data-o="asp"><option value="16/9">横長 16:9</option><option value="4/3">4:3</option><option value="1/1">正方形</option></select></label>
      <label class="lab">形式<select data-o="fmt"><option value="png">PNG</option><option value="jpg">JPEG</option></select></label>
      <label class="lab">素材のはめ込み<select data-o="rf"><option value="cover">枠いっぱい(はみ出しをカット)</option><option value="contain">全体を表示(余白あり)</option></select></label>
      <label class="lab">外の余白<input type="range" data-o="pad" min="0" max="120"></label>
      <label class="lab">コマの間隔<input type="range" data-o="gap" min="0" max="60"></label>
      <label class="lab">枠線の太さ<input type="range" data-o="bw" min="0" max="20"></label>
      <label class="lab">背景色<input type="color" data-o="bg"></label>
      <label class="lab">枠線の色<input type="color" data-o="bc"></label>
    </div>
    <button class="primary" id="dl">画像をダウンロード</button>
    <button class="ghost" id="reset">編集内容をリセット</button>
  </aside>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<input type="file" id="fi" accept="image/*" hidden>
<script src="app.js"></script>
</body>
</html>
